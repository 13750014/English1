<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <style>
        /* 訂製答題紀錄區塊的樣式 */
        .record-badge {
            cursor: pointer;
            transition: transform 0.1s ease-in-out;
        }
        .record-badge:hover {
            transform: scale(1.05);
        }
        /* 改為指定顏色：對=紅色，錯=綠色 */
        .status-correct {
            background-color: #198754 !important; /* Bootstrap 綠色 */
            color: white;
        }
        .status-wrong {
            background-color:#dc3545 !important; /* Bootstrap 紅色 */
            color: white;
        }
        .status-unanswered {
            background-color: #e9ecef;
            color: #6c757d;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英文單字考題</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- 使用 container-fluid 或 container 加寬容納雙欄 -->
    <div class="container mt-5" style="max-width: 1000px;">
        <div class="row g-4">
            
            <!-- 左側：主要答題區域 (佔 8 格) -->
            <div class="col-md-8">
                <div class="card p-4 shadow-sm h-100">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="text-muted small" id="question-index">題號: 0 / 0</span>
                    </div>
                    
                    <h4 class="card-title mb-4 fw-bold" id="question-text">載入題目中...</h4>
                    
                    <!-- 選項按鈕區 -->
                    <div class="row g-3" id="options-container"></div>

                    <!-- 回饋訊息 -->
                    <div class="alert mt-4 d-none" id="feedback-box" role="alert"></div>
                </div>
            </div>

            <!-- 右側：答題對錯紀錄欄位 (佔 4 格) -->
            <div class="col-md-4">
                <div class="card p-4 shadow-sm h-100">
                    <h5 class="card-title fw-bold mb-3 border-bottom pb-2">答題紀錄</h5>
                    
                    <!-- 圖例說明 -->
                    <div class="d-flex justify-content-around mb-3 small">
                        <span><span class="badge status-correct">●</span> 正確 (綠)</span>
                        <span><span class="badge status-wrong">●</span> 錯誤 (紅)</span>
                        <span><span class="badge status-unanswered">●</span> 未答</span>
                    </div>

                    <!-- 題目號碼狀態卡片區 (利用 JS 動態產生) -->
                    <div class="d-flex flex-wrap gap-2" id="answer-tracker">
                        <!-- 範例預覽 (實際會透過 JavaScript 動態渲染) -->
                        <span class="badge status-correct p-2 fs-6 record-badge">1</span>
                        <span class="badge status-wrong p-2 fs-6 record-badge">2</span>
                        <span class="badge status-unanswered p-2 fs-6 record-badge">3</span>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="question_1.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
